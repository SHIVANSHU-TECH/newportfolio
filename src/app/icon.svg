<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep dark background gradient for depth -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <!-- Lime accent gradient matching --accent:#c8f542 -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8f542"/>
      <stop offset="100%" stop-color="#aed936"/>
    </linearGradient>
    <!-- Subtle glow filter for the letters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background square with very subtle rounded corners — premium feel -->
  <rect width="64" height="64" rx="10" fill="url(#bg)"/>

  <!-- Thin border line for luxury definition -->
  <rect x="1" y="1" width="62" height="62" rx="9.5" fill="none" stroke="#242424" stroke-width="1"/>

  <!-- Hairline accent bar — top edge, lime -->
  <rect x="10" y="5" width="44" height="1.5" rx="0.75" fill="url(#accent)" opacity="0.9"/>

  <!-- "S" left — cream, tight tracking, serif-style weight -->
  <text
    x="17"
    y="43"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="28"
    fill="#f0ede8"
    filter="url(#glow)"
    letter-spacing="0"
  >S</text>

  <!-- "S" right — lime accent, matching weight -->
  <text
    x="47"
    y="43"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="28"
    fill="#c8f542"
    filter="url(#glow)"
    letter-spacing="0"
  >S</text>

  <!-- Separator dot between the two S letters — adds refinement -->
  <circle cx="32" cy="36" r="2" fill="#2e2e2e"/>

  <!-- Bottom hairline — mirrors the top accent bar but dimmer -->
  <rect x="10" y="57.5" width="44" height="1" rx="0.5" fill="#242424"/>
</svg>
